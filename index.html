<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASTRAEA</title>
  <meta name="description" content="ASTRAEA: an interactive atlas of the gene regulatory network of the human endometrium. Hickey Lab, Duke University.">
  <link rel="icon" type="image/svg+xml" href="assets/astraea-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="landing.css">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>

  <main class="hero">
    <svg class="logo" viewBox="0 0 1140 250" role="img" aria-label="ASTRAEA">
      <defs>
        <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f6ddd3"/><stop offset="0.45" stop-color="#e0b2a4"/><stop offset="1" stop-color="#c17f70"/>
        </linearGradient>
      </defs>
      <g transform="translate(126 125)">
        <circle r="74" fill="none" stroke="url(#ink)" stroke-width="1.6" opacity="0.45"/>
        <path d="M0 -106 Q 5.5 -11 94 0 Q 5.5 11 0 106 Q -5.5 11 -94 0 Q -5.5 -11 0 -106 Z" fill="url(#ink)"/>
        <circle cx="0" cy="-99" r="3.6" fill="url(#ink)" opacity="0.85"/>
        <circle cx="0" cy="99" r="3.6" fill="url(#ink)" opacity="0.85"/>
      </g>
      <path d="M258 130 Q 264 121 280 118 Q 264 115 258 106 Q 252 115 236 118 Q 252 121 258 130 Z" fill="url(#ink)" opacity="0.8"/>
      <text x="318" y="162" font-family="Cinzel, 'Times New Roman', serif" font-size="112" letter-spacing="27" fill="url(#ink)">ASTRAEA</text>
      <path d="M1084 130 Q 1090 121 1106 118 Q 1090 115 1084 106 Q 1078 115 1062 118 Q 1078 121 1084 130 Z" fill="url(#ink)" opacity="0.8"/>
    </svg>

    <nav class="entries" aria-label="Open the atlas">
      <a href="atlas.html?ui=desktop" data-ui="desktop">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="1.6"/><path d="M9 20.5h6M12 17.5v3"/></svg>
        <span>Desktop</span>
      </a>
      <a href="atlas.html?ui=tablet" data-ui="tablet">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="1.8"/><path d="M11 19h2"/></svg>
        <span>iPad</span>
      </a>
      <a href="atlas.html?ui=phone" data-ui="phone">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7.5" y="2.5" width="9" height="19" rx="2"/><path d="M11 19h2"/></svg>
        <span>Mobile</span>
      </a>
    </nav>
  </main>

  <script>
    // Faint starfield; static when the visitor prefers reduced motion.
    (function () {
      const c = document.getElementById("stars"), x = c.getContext("2d");
      const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let stars = [], w = 0, h = 0, raf = null;
      function seed() {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        w = c.width = Math.round(innerWidth * dpr); h = c.height = Math.round(innerHeight * dpr);
        c.style.width = innerWidth + "px"; c.style.height = innerHeight + "px";
        const n = Math.min(200, Math.round((innerWidth * innerHeight) / 10000));
        stars = Array.from({ length: n }, () => ({
          x: Math.random() * w, y: Math.random() * h, r: (Math.random() * 1.05 + 0.3) * dpr,
          a: Math.random() * 0.45 + 0.15, t: Math.random() * 6.28, s: Math.random() * 0.6 + 0.2,
        }));
      }
      function draw(now) {
        x.clearRect(0, 0, w, h);
        x.fillStyle = "#e9d6cf";
        for (const st of stars) {
          x.globalAlpha = still ? st.a : st.a * (0.6 + 0.4 * Math.sin(st.t + now / 1000 * st.s));
          x.beginPath(); x.arc(st.x, st.y, st.r, 0, 6.2832); x.fill();
        }
        x.globalAlpha = 1;
        if (!still) raf = requestAnimationFrame(draw);
      }
      function start() { if (raf) cancelAnimationFrame(raf); seed(); draw(performance.now()); }
      addEventListener("resize", start);
      start();
    })();

    // Mark the entry that fits the current screen; no text needed.
    (function () {
      const w = innerWidth;
      const guess = w < 700 ? "phone" : w < 1180 ? "tablet" : "desktop";
      document.querySelector(`.entries a[data-ui="${guess}"]`)?.classList.add("suggested");
    })();
  </script>
</body>
</html>
