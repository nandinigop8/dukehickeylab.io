# Conda alternative to requirements.txt:
#   conda env create -f environment.yml && conda activate grn-site
name: grn-site
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pandas=2.3.3
  - numpy=2.2.6
  - python-igraph=1.0.0
  - leidenalg=0.12.0
  - nodejs=24        # optional: only for the browser test (script/tests)
